<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 540px;
    font-family: Arial, sans-serif;
  }
  .instagram-media {
    margin: 0 auto !important;
    min-width: 0 !important;
    width: 100% !important;
    max-width: 540px !important;
  }
</style>
</head>
<body>

  <div id="ig-wrapper" style="width: 100%; display: flex; justify-content: center;">
    <!-- Respaldo por defecto -->
    <blockquote
      class="instagram-media"
      data-instgrm-captioned
      data-instgrm-permalink="https://www.instagram.com/reel/DQIK9pLDl4l/"
      data-instgrm-version="14">
    </blockquote>
  </div>

<script>
  // Consultar la configuración guardada en el panel web (Sección 2)
  fetch('/api/web/home')
    .then(res => res.json())
    .then(data => {
      if (data && data.sec2 && data.sec2.instagram_embed) {
        const wrapper = document.getElementById('ig-wrapper');
        wrapper.innerHTML = data.sec2.instagram_embed;
        if (window.instgrm && window.instgrm.Embeds) {
          window.instgrm.Embeds.process();
        }
      }
    })
    .catch(err => {
      console.log("Usando embed por defecto", err);
    });
</script>
<script async src="https://www.instagram.com/embed.js"></script>
</body>
</html>
